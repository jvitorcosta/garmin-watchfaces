name: Bug report
description: A face won't build, or shows something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Face, watch or simulator, and Connect IQ SDK version
  - type: textarea
    id: logs
    attributes:
      label: Build output or error
      render: text
